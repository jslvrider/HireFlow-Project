substitutions:
  _REGION: us-central1
  _REPO: hireflow-repo
  _SERVICE: hireflow
  _TAG: ${SHORT_SHA}   # the commit ID when run by a trigger; overridden for manual runs
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/hireflow:${_TAG}

steps:
  # 1. Run the tests. If any fail, the build stops here and nothing deploys.
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu &&
        pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt &&
        pytest -v

  # 2. Build the image from the Dockerfile
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]

  # 3. Push it to Artifact Registry
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]

  # 4. Point the Cloud Run service at the new image
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --service-account=hireflow-runtime@${PROJECT_ID}.iam.gserviceaccount.com

images:
  - ${_IMAGE}

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true